name: Compile wLaunchELF_ISR (A9VG汉化版)

on:
  workflow_dispatch:
    inputs:
      exfat:
        description: 'Build with EXFAT+BDM support'
        required: false
        default: '1'
      mx4sio:
        description: 'Build with MX4SIO (SD slot 2) support'
        required: false
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    # 与 israpps 官方 CI 相同的工具链镜像（$PS2SDK 即源码树，含 IOP 工具链与 ps2-packer）
    # 注意：该镜像基于较老 Alpine（musl 无 pthread_getname_np），只能跑 node20 的
    # JS actions —— 因此必须用 checkout@v4，且不能设置 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24
    container: ps2dev/ps2dev:v1.0
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache make git zip bash

      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --prune --unshallow

      - name: Patch FatFs for Chinese long file names (CP936)
        run: |
          chmod +x scripts/ci/patch_fatfs_chinese.sh
          bash scripts/ci/patch_fatfs_chinese.sh

      - name: Compile wLaunchELF_ISR
        run: |
          make rebuild EXFAT=${{ github.event.inputs.exfat }} MX4SIO=${{ github.event.inputs.mx4sio }}

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: wLaunchELF_ISR-A9VG
          path: BOOT*.ELF
