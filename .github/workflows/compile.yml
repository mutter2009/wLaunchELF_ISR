name: Compile wLaunchELF_ISR (A9VG汉化版)

on:
  workflow_dispatch:
    inputs:
      exfat:
        description: 'EXFAT / BDM 支持（USB 中文长文件名必需）'
        required: false
        default: '1'
      mx4sio:
        description: 'MX4SIO（SD 卡）支持'
        required: false
        default: '1'
      xfrom:
        description: '额外编译两个 XFROM 版本'
        required: false
        default: '1'

env:
  # GitHub 于 2025-09 弃用 Node20 并默认强制 Node24，而 israpps 官方 CI 所用的
  # ps2dev/ps2dev:v1.0 老镜像 musl 无法运行 Node24。此开关是 GitHub 官方文档
  # 提供的临时方案，允许 Node20 的 JS actions 继续运行（israpps 官方即 Node20
  # 时代配置）。除汉化 patch 步骤外，本 workflow 与 israpps 官方配置一致。
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    # israpps 官方 CI 原版镜像：预装 ps2sdk-ports（libjpg/gsKit）、ps2-packer，
    # 且 $PS2SDK 即 ps2sdk 源码树（供 patch 脚本重编 bdmfs_fatfs）
    container: ps2dev/ps2dev:v1.0
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache make git zip bash build-base

      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --prune --unshallow

      - name: Patch FatFs for Chinese long file names (CP936)
        run: |
          chmod +x scripts/ci/patch_fatfs_chinese.sh
          bash scripts/ci/patch_fatfs_chinese.sh

      - name: Build 1/3  BOOT-EXFAT-MX4SIO.ELF
        run: |
          make rebuild EXFAT=${{ github.event.inputs.exfat }} MX4SIO=${{ github.event.inputs.mx4sio }}
          mkdir -p out && cp -f BOOT*.ELF out/

      - name: Build 2/3  BOOT-EXFAT-MX4SIO-XFROM.ELF
        if: ${{ github.event.inputs.xfrom == '1' }}
        run: |
          make rebuild EXFAT=1 MX4SIO=1 XFROM=1
          mkdir -p out && cp -f BOOT*.ELF out/

      - name: Build 3/3  BOOT-EXFAT-MMCE-XFROM.ELF
        if: ${{ github.event.inputs.xfrom == '1' }}
        run: |
          make rebuild EXFAT=1 MMCE=1 XFROM=1
          mkdir -p out && cp -f BOOT*.ELF out/

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: wLaunchELF_ISR-A9VG
          path: out/*.ELF
