name: Compile wLaunchELF_ISR (A9VG汉化版)

on:
  workflow_dispatch:
    inputs:
      exfat:
        description: 'Build with EXFAT+BDM support'
        required: false
        default: '1'
      mx4sio:
        description: 'Build with MX4SIO (SD slot 2) support'
        required: false
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    # 必须用 latest（新 Alpine/musl 支持 Node24 的 JS actions）。
    # v1.0 老镜像的 musl 缺 pthread_getname_np，Node20/24 的 action 都跑不了
    # （2025-09 起 GitHub 已弃用 Node20，无法再退回）。
    # latest 镜像的 $PS2SDK 同样是带 Defs.make 的 ps2sdk 源码树，
    # 缺少的 FatFs 外部依赖由 patch 脚本直接克隆 fjtrujy/FatFs 解决。
    container: ps2dev/ps2dev:latest
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache make git zip bash

      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --prune --unshallow

      - name: Patch FatFs for Chinese long file names (CP936)
        run: |
          chmod +x scripts/ci/patch_fatfs_chinese.sh
          bash scripts/ci/patch_fatfs_chinese.sh

      - name: Compile wLaunchELF_ISR
        run: |
          make rebuild EXFAT=${{ github.event.inputs.exfat }} MX4SIO=${{ github.event.inputs.mx4sio }}

      - name: Upload ELF
        uses: actions/upload-artifact@v7
        with:
          name: wLaunchELF_ISR-A9VG
          path: BOOT*.ELF
