name: Compile wLaunchELF_ISR (A9VG汉化版)

on:
  workflow_dispatch:
    inputs:
      exfat:
        description: 'Build with EXFAT+BDM support'
        required: false
        default: '1'
      mx4sio:
        description: 'Build with MX4SIO (SD slot 2) support'
        required: false
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache git bash

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Patch FatFs for Chinese long file names (CP936)
        run: |
          chmod +x scripts/ci/patch_fatfs_chinese.sh
          bash scripts/ci/patch_fatfs_chinese.sh

      - name: Compile wLaunchELF_ISR
        run: |
          make EXFAT=${{ github.event.inputs.exfat }} MX4SIO=${{ github.event.inputs.mx4sio }}

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: BOOT-EXFAT-MX4SIO
          path: BOOT-EXFAT-MX4SIO.ELF
