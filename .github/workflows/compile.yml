name: Compile wLaunchELF_ISR (A9VG汉化版)

on:
  workflow_dispatch:
    inputs:
      skip_driver_check:
        description: '跳过 iop/__precompiled 驱动校验（一般不需要）'
        required: false
        type: boolean
        default: false

env:
  # GitHub 于 2025-09 弃用 Node20 并默认强制 Node24，而 israpps 官方 CI 所用的
  # ps2dev/ps2dev:v1.0 老镜像 musl 无法运行 Node24。此开关允许 Node20 的 JS actions
  # 继续运行。除驱动校验步骤外，本 workflow 与 israpps 官方配置一致。
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  #===========================================================================
  # USB 驱动修复（2026-09-15）:
  #   之前 USB 看不到文件，根因是仓库 iop/__precompiled/ 缺少 bdm/bdmfs_fatfs/
  #   usbmass_bd 三个驱动（它们本应由 israpps 上游提交），而旧补丁脚本又用老工具链
  #   从 ps2sdk master 源码把它们重编成了坏二进制。
  #   现已把上游 israpps/wLaunchELF_ISR 提交的那套 iop/__precompiled/*.irx
  #   （含 bdm/bdmfs_fatfs/usbmass_bd，支持 exFAT + UTF-8 长名）补全进仓库，
  #   EE 构建时 embed.make 直接嵌入，不再从源码重编。这与 R3Z（用现代工具链 +
  #   预编译驱动）能识别 U 盘的做法一致。
  #
  #   本 workflow 一次产出 6 个版本：
  #     带背景图: BOOT-EXFAT-MX4SIO.ELF / BOOT-EXFAT-MMCE.ELF
  #               BOOT-EXFAT-MMCE-XFROM.ELF / BOOT-EXFAT-MX4SIO-XFROM.ELF
  #     无背景浅灰: BOOT-EXFAT-MX4SIO-NOBG.ELF / BOOT-EXFAT-MMCE-NOBG.ELF
  #   （MX4SIO 与 MMCE 插在同一记忆卡槽、不能共存，故分开两个版本；XFROM 仅带背景）
  #===========================================================================
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:v1.0
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache make git zip bash build-base

      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --prune --unshallow

      - name: Verify committed USB/BDM drivers
        if: ${{ inputs.skip_driver_check != true }}
        run: |
          chmod +x scripts/ci/patch_fatfs_chinese.sh
          bash scripts/ci/patch_fatfs_chinese.sh

      - name: Build 1/6  BOOT-EXFAT-MX4SIO.ELF (带背景图)
        run: |
          make rebuild EXFAT=1 MX4SIO=1 BG=1
          mkdir -p out && cp -f BOOT*.ELF out/

      - name: Build 2/6  BOOT-EXFAT-MMCE.ELF (带背景图)
        run: |
          make rebuild EXFAT=1 MMCE=1 BG=1
          mkdir -p out && cp -f BOOT*.ELF out/

      - name: Build 3/6  BOOT-EXFAT-MMCE-XFROM.ELF (带背景图)
        run: |
          make rebuild EXFAT=1 MMCE=1 XFROM=1 BG=1
          mkdir -p out && cp -f BOOT*.ELF out/

      - name: Build 4/6  BOOT-EXFAT-MX4SIO-XFROM.ELF (带背景图)
        run: |
          make rebuild EXFAT=1 MX4SIO=1 XFROM=1 BG=1
          mkdir -p out && cp -f BOOT*.ELF out/

      - name: Build 5/6  BOOT-EXFAT-MX4SIO-NOBG.ELF (无背景浅灰)
        run: |
          make rebuild EXFAT=1 MX4SIO=1 BG=0
          mkdir -p out && cp -f BOOT*.ELF out/

      - name: Build 6/6  BOOT-EXFAT-MMCE-NOBG.ELF (无背景浅灰)
        run: |
          make rebuild EXFAT=1 MMCE=1 BG=0
          mkdir -p out && cp -f BOOT*.ELF out/

      - name: List built ELF
        run: |
          ls -la out/

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: wLaunchELF_ISR-A9VG
          path: out/*.ELF
