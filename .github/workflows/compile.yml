name: Compile wLaunchELF_ISR (A9VG汉化版)

on:
  workflow_dispatch:
    inputs:
      exfat:
        description: 'EXFAT / BDM 支持（USB 中文长文件名必需）'
        required: false
        default: '1'
      mx4sio:
        description: 'MX4SIO（SD 卡）支持'
        required: false
        default: '1'
      xfrom:
        description: '额外编译两个 XFROM 版本'
        required: false
        default: '1'
      bg:
        description: '内置默认背景图（黑屏排障时选 0 可彻底关闭）'
        required: false
        type: choice
        options: ['1', '0']
        default: '1'
      fatfs_mode:
        description: '文件系统驱动方案（off=用仓库原版驱动）'
        required: false
        type: choice
        options: ['utf8', '936', 'off']
        default: 'utf8'

env:
  # ps2homebrew:main 镜像内的 musl 也无法运行 Node24，保留 GitHub 官方兼容开关。
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  #===========================================================================
  # 单 job，参考 wLaunchELF_R3Z 使用 ghcr.io/ps2homebrew/ps2homebrew:main 镜像。
  #
  #   该镜像携带更新的 GCC/binutils，能直接编译 ps2sdk master 的 IOP 模块，
  #   不需要再对 IOP linkfile 做 GCC 3.2.3 兼容补丁。R3Z 已用此镜像稳定构建，
  #   我们沿用即可。
  #
  #   Patch 这一步不再 continue-on-error：中文长文件名是汉化版核心功能，
  #   若此步骤失败，后面的 Build 不应继续用仓库原版驱动出包。
  #===========================================================================
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    steps:
      - name: Install dependencies
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache make git zip gcc musl-dev gmp mpfr4 mpc1
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y make git zip gcc libc6-dev libgmp10 libmpfr6 libmpc3
          else
            echo "No supported package manager found." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --prune --unshallow

      - name: Patch FatFs driver (${{ github.event.inputs.fatfs_mode }})
        if: ${{ github.event.inputs.fatfs_mode != 'off' }}
        env:
          FATFS_MODE: ${{ github.event.inputs.fatfs_mode }}
        run: |
          chmod +x scripts/ci/patch_fatfs_chinese.sh
          bash scripts/ci/patch_fatfs_chinese.sh

      - name: Verify FatFs driver
        run: |
          set -u
          IRX="iop/__precompiled/bdmfs_fatfs.irx"
          MARK="iop/__precompiled/.a9vg_fatfs_ok"
          if [ ! -f "$MARK" ]; then
            echo "WARN: FatFs 重编没有成功，使用仓库原版驱动。"
            echo "      （只是没有中文长文件名，其余功能不受影响，ELF 照常出包）"
            [ -f "$IRX" ] && git checkout -- "$IRX" || true
            exit 0
          fi
          SIZE=$(wc -c < "$IRX" | tr -d ' ')
          echo "bdmfs_fatfs.irx = $SIZE bytes (仓库原版 37724)"
          if [ "$SIZE" -lt 20000 ]; then
            echo "WARN: 体积异常，疑似坏文件，还原成仓库原版"
            git checkout -- "$IRX"
            rm -f "$MARK"
            exit 0
          fi
          echo "OK: 将使用重编后的驱动（模式 ${{ github.event.inputs.fatfs_mode }}）"
          echo "======================================================"
          echo " 本轮构建参数: BG=${{ github.event.inputs.bg }}  FATFS_MODE=${{ github.event.inputs.fatfs_mode }}"
          echo "======================================================"

      - name: Build 1/3  BOOT-EXFAT-MX4SIO.ELF
        run: |
          make rebuild EXFAT=${{ github.event.inputs.exfat }} MX4SIO=${{ github.event.inputs.mx4sio }} BG=${{ github.event.inputs.bg }}
          mkdir -p out && cp -f BOOT*.ELF out/

      - name: Build 2/3  BOOT-EXFAT-MX4SIO-XFROM.ELF
        if: ${{ github.event.inputs.xfrom == '1' }}
        run: |
          make rebuild EXFAT=1 MX4SIO=1 XFROM=1 BG=${{ github.event.inputs.bg }}
          mkdir -p out && cp -f BOOT*.ELF out/

      - name: Build 3/3  BOOT-EXFAT-MMCE-XFROM.ELF
        if: ${{ github.event.inputs.xfrom == '1' }}
        run: |
          make rebuild EXFAT=1 MMCE=1 XFROM=1 BG=${{ github.event.inputs.bg }}
          mkdir -p out && cp -f BOOT*.ELF out/

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: wLaunchELF_ISR-A9VG
          path: out/*.ELF
